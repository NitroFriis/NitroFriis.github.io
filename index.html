<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BEN JEMAA GROUPE</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
:root{
  --bg:#0d2219;
  --bg-grad:radial-gradient(circle at 50% 18%,#163829 0%,#0d2219 65%,#081610 100%);
  --card:#122e22;
  --card-hover:#17392b;
  --ink:#f3e5b5;
  --mute:#b8c4b5;
  --gold:#d4a74a;
  --gold-bright:#e5be6b;
  --line:#27503d;
  --btn:#d4a74a;
  --btnt:#0b1d15;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg-grad);
  background-color:var(--bg);
  color:var(--ink);
  font:400 17px/1.6 "Source Sans 3",system-ui,sans-serif;
  position:relative;
}
main{max-width:640px;margin:0 auto;padding:0 20px 48px}
h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;line-height:1.1;margin:0}
h1{font-size:2.4rem}
h2{font-size:1.85rem;margin-bottom:10px;color:var(--gold-bright)}
header{text-align:center;padding:54px 0 12px}
header img{
  width:min(76%,290px);
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:50%;
  display:block;
  margin:0 auto 16px;
  border:2px solid rgba(212,167,74,.45);
  box-shadow:0 16px 36px rgba(0,0,0,.48);
  background:var(--card);
}
.tag{color:var(--mute);margin:8px 0 0}
section{padding:30px 0;border-top:1px solid var(--line)}
.prod{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.prod h2{color:var(--gold)}
.sizes{display:flex;gap:10px;margin:14px 0 0;flex-wrap:wrap}
.sizes span{border:1px solid var(--gold);border-radius:999px;padding:4px 16px;font-weight:600}
form{display:grid;gap:12px;margin-top:14px}
label{font-weight:600;font-size:.95rem}
input,select{width:100%;font:inherit;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{font:600 1rem "Source Sans 3",system-ui,sans-serif;padding:14px;border:0;border-radius:8px;background:var(--btn);color:var(--btnt);cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#msg{min-height:1.4em;color:var(--mute);margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pimg{width:100%;border-radius:10px;display:block;margin:0 0 14px;background:var(--card)}
.grid{display:grid;gap:12px;margin-top:14px}
.card{
  display:block;
  text-decoration:none;
  color:inherit;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:16px;
  transition:background .18s ease,border-color .18s ease,transform .18s ease;
}
.card:hover{
  background:var(--card-hover);
  border-color:var(--gold);
  transform:translateY(-1px);
}
.card h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.4rem;margin:0 0 4px;color:var(--gold-bright)}
.card p{margin:0;color:var(--mute)}
a.card:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
footer{text-align:center;color:var(--mute);font-size:.9rem;padding-top:24px;border-top:1px solid var(--line)}

.back{display:inline-block;margin:18px 0 0;color:var(--gold);font-weight:600;text-decoration:none}
.soon{color:var(--mute)}

.who{
  position:absolute;
  top:calc(env(safe-area-inset-top,0px) + 10px);
  right:14px;
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:999px;
  padding:5px 10px 5px 12px;
  font-size:.9rem;
  font-weight:600;
  color:var(--ink);
}
.who[hidden]{display:none}
.dot{width:10px;height:10px;border-radius:50%;background:#2ecc71;box-shadow:0 0 0 3px rgba(46,204,113,.25)}
.logout-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:24px;
  height:24px;
  padding:0;
  border-radius:50%;
  background:transparent;
  color:var(--gold-bright);
  border:1px solid transparent;
  line-height:1;
}
.logout-btn:hover{
  background:rgba(212,167,74,.14);
  border-color:rgba(212,167,74,.45);
}
</style>
</head>
<body>
<main>
<div class="who" id="who" hidden>
  <span class="dot"></span>
  <span id="wtxt"></span>
  <button type="button" class="logout-btn" id="logoutBtn" title="Logout" aria-label="Logout">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
      <polyline points="16 17 21 12 16 7"></polyline>
      <line x1="21" y1="12" x2="9" y2="12"></line>
    </svg>
  </button>
</div>
